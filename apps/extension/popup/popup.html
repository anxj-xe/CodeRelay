<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeRelay</title>
    <style>
        :root {
            --bg: #121316;
            --card-bg: #1c1e24;
            --border: #2e323b;
            --text: #f0f2f5;
            --text-dim: #8b949e;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            width: 320px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 9999px;
            background: var(--card-bg);
            border: 1px solid var(--border);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--danger);
        }

        .dot.online {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .value {
            font-size: 13px;
            color: var(--text);
            word-break: break-all;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        }

        .tip {
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.4;
        }

        .btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2563eb;
        }

        code {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
            color: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">CodeRelay</div>
        <div id="statusBadge" class="status-badge">
            <span id="statusDot" class="dot"></span>
            <span id="statusText">Checking...</span>
        </div>
    </div>

    <div class="card">
        <div class="label">Local Server</div>
        <div class="value" id="serverUrlDisplay">http://127.0.0.1:45678</div>
    </div>

    <div class="card">
        <div class="label">Target Repository</div>
        <div class="value" id="repoPathDisplay">-</div>
    </div>

    <div class="card">
        <div class="tip" id="instructions">
            Make sure the local server is running by typing <code>coderelay start</code> in your terminal.
        </div>
    </div>

    <button id="refreshBtn" class="btn">Test Connection</button>

    <script src="popup.js"></script>
</body>
</html>
